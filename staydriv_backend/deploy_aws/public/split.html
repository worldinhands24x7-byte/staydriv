<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayDriv Unified Testing Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f19;
      --header-bg: rgba(18, 22, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #2563eb;
      --text-color: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .badge {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #60a5fa;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .instructions {
      font-size: 13px;
      color: #9ca3af;
      max-width: 650px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .instructions span {
      color: #3b82f6;
      font-weight: 600;
    }

    .split-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 70px);
      background-color: #07080e;
    }

    .panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel:first-child {
      border-right: 2px solid var(--border-color);
    }

    .panel-header {
      background: rgba(15, 20, 35, 0.95);
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #f3f4f6;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header.customer {
      border-top: 3px solid #3b82f6;
    }

    .panel-header.driver {
      border-top: 3px solid #10b981;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .customer-dot {
      background-color: #3b82f6;
      box-shadow: 0 0 8px #3b82f6;
    }

    .driver-dot {
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo">StayDriv</div>
      <div class="badge">Split-Screen Workspace</div>
    </div>
    <div class="instructions">
      💡 <span>How to Test:</span> 1. On the Pilot side (right), toggle the <span>Driver Console</span> switch online. 2. On the Customer side (left), set pickup/drop and press <span>Book Now</span>. 3. Click <span>Accept</span> on the Pilot modal when it rings.
    </div>
  </header>
  
  <div class="split-container">
    <div class="panel">
      <div class="panel-header customer">
        <span>Customer App</span>
        <div class="indicator">
          <span class="dot customer-dot"></span>
          <span>Customer Console</span>
        </div>
      </div>
      <iframe src="/?role=Customer"></iframe>
    </div>
    
    <div class="panel">
      <div class="panel-header driver">
        <span>Pilot App</span>
        <div class="indicator">
          <span class="dot driver-dot"></span>
          <span>Driver Console</span>
        </div>
      </div>
      <iframe src="/?role=Driver"></iframe>
    </div>
  </div>
</body>
</html>
