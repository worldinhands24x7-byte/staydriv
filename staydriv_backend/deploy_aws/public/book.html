<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StayDriv – Book Your Ride</title>
  <meta name="description" content="Fast, reliable and affordable rides with StayDriv. Book Bike, Auto, Cab, Round Trips and Outstation rides.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 100px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
    }
    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .route-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .route-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }
    .route-row:not(:last-child) {
      margin-bottom: 16px;
    }
    .dot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4px;
    }
    .dot-green {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }
    .dot-line {
      width: 2px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
      margin: 4px 0;
    }
    .dot-red {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 10px #EF4444;
    }
    .location-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748B;
      margin-bottom: 2px;
    }
    .location-name {
      font-size: 14px;
      font-weight: 600;
      color: #F1F5F9;
      line-height: 1.3;
      word-break: break-word;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      margin-bottom: 12px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px -5px rgba(37, 99, 235, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 10px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }
    .btn-outline {
      background: transparent;
      color: #94A3B8;
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
    }
    .btn-outline:hover {
      color: #F1F5F9;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
      </svg>
    </div>
    <h1>Ride Invitation</h1>
    <p class="subtitle">Complete your ride booking safely with StayDriv</p>

    <div class="route-card" id="routeCard">
      <div class="route-row">
        <div class="dot-col">
          <div class="dot-green"></div>
          <div class="dot-line"></div>
          <div class="dot-red"></div>
        </div>
        <div style="flex: 1;">
          <div>
            <div class="location-label">Pickup Location</div>
            <div class="location-name" id="pickupDisplay">Current Location / Pin</div>
          </div>
          <div style="margin-top: 14px;">
            <div class="location-label">Destination</div>
            <div class="location-name" id="dropDisplay">Select Destination in App</div>
          </div>
        </div>
      </div>
    </div>

    <a href="#" id="openAppBtn" class="btn btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m2 4v2h10V7H7m0 4v2h10v-2H7m0 4v2h7v-2H7z"/>
      </svg>
      Open in StayDriv App
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.staydriv.app" id="playStoreBtn" class="btn btn-secondary" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
      </svg>
      Get on Google Play
    </a>

    <a href="/staydriv.apk" class="btn btn-outline" download>
      Direct APK Download (v1.0.81)
    </a>

    <p class="footer-note">A ride is only confirmed once you review the fare and tap Confirm in the app.</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var pickup = params.get('pickup') || params.get('pname') || params.get('from') || '';
      var drop = params.get('drop') || params.get('dname') || params.get('to') || params.get('destination') || '';
      var plat = params.get('plat') || params.get('pickupLat') || '';
      var plng = params.get('plng') || params.get('pickupLng') || '';
      var dlat = params.get('dlat') || params.get('dropLat') || '';
      var dlng = params.get('dlng') || params.get('dropLng') || '';
      var service = params.get('service') || params.get('serviceType') || 'bike';
      var ref = params.get('ref') || params.get('bookingId') || '';

      if (pickup) {
        document.getElementById('pickupDisplay').innerText = decodeURIComponent(pickup.replace(/\+/g, ' '));
      }
      if (drop) {
        document.getElementById('dropDisplay').innerText = decodeURIComponent(drop.replace(/\+/g, ' '));
      }

      // Construct native deep link URL
      var deepLink = 'staydriv://book?' + window.location.search.replace(/^\?/, '');
      var openAppBtn = document.getElementById('openAppBtn');
      openAppBtn.href = deepLink;

      // Check if running on Android/mobile browser
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        // Attempt immediate app launch
        window.location.href = deepLink;
      }
    })();
  </script>
</body>
</html>
