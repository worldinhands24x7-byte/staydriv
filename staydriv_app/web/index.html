<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="staydriv_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>staydriv_app</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2Lw1UPJAVtzSBY4JARHS6yV284w2hneg"></script>
  <script>
    // Unregister any active service worker to prevent caching issues during testing
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // BroadcastChannel for cross-tab communication
    const syncChannel = new BroadcastChannel('staydriv_sync_channel');
    syncChannel.onmessage = function(event) {
      if (window.onStayDrivSyncMessage) {
        window.onStayDrivSyncMessage(JSON.stringify(event.data));
      }
    };
    window.postStayDrivSync = function(msgJson) {
      try {
        const data = JSON.parse(msgJson);
        syncChannel.postMessage(data);
      } catch (e) {
        console.error("Error posting staydriv sync message", e);
      }
    };

    let stayDrivAudioCtx = null;
    let stayDrivRingingInterval = null;

    // Unlock AudioContext on user interaction
    const unlockAudioContext = () => {
      if (!stayDrivAudioCtx) {
        stayDrivAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (stayDrivAudioCtx.state === 'suspended') {
        stayDrivAudioCtx.resume().then(() => {
          console.log("AudioContext unlocked successfully!");
          window.removeEventListener('click', unlockAudioContext);
          window.removeEventListener('touchstart', unlockAudioContext);
        });
      } else {
        window.removeEventListener('click', unlockAudioContext);
        window.removeEventListener('touchstart', unlockAudioContext);
      }
    };
    window.addEventListener('click', unlockAudioContext);
    window.addEventListener('touchstart', unlockAudioContext);

    window.startStayDrivRinging = function() {
      if (stayDrivRingingInterval) return; // already ringing
      
      const playChime = () => {
        try {
          if (!stayDrivAudioCtx) {
            stayDrivAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (stayDrivAudioCtx.state === 'suspended') {
            stayDrivAudioCtx.resume();
          }
          
          // Synthesize a dual-tone telephone alert chime
          const osc1 = stayDrivAudioCtx.createOscillator();
          const osc2 = stayDrivAudioCtx.createOscillator();
          const gainNode = stayDrivAudioCtx.createGain();
          
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(440, stayDrivAudioCtx.currentTime); // A4
          osc1.frequency.exponentialRampToValueAtTime(880, stayDrivAudioCtx.currentTime + 0.4); // A5
          
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(554.37, stayDrivAudioCtx.currentTime); // C#5
          osc2.frequency.exponentialRampToValueAtTime(1108.73, stayDrivAudioCtx.currentTime + 0.4); // C#6
          
          gainNode.gain.setValueAtTime(0.35, stayDrivAudioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, stayDrivAudioCtx.currentTime + 0.5);
          
          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(stayDrivAudioCtx.destination);
          
          osc1.start();
          osc2.start();
          
          osc1.stop(stayDrivAudioCtx.currentTime + 0.5);
          osc2.stop(stayDrivAudioCtx.currentTime + 0.5);
        } catch (e) {
          console.error("Audio playback error: ", e);
        }
      };

      // Play chime immediately, and repeat every 1.5 seconds
      playChime();
      stayDrivRingingInterval = setInterval(playChime, 1500);
    };

    window.stopStayDrivRinging = function() {
      if (stayDrivRingingInterval) {
        clearInterval(stayDrivRingingInterval);
        stayDrivRingingInterval = null;
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
